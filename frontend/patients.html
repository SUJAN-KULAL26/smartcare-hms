<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SmartCare HMS - Patients</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/claymorphism.css">
</head>

<body>

  <!-- Ambient Animated Background Blobs -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>
  <div class="bg-blob blob-4"></div>

  <div class="app-layout">
    
    <!-- Clay Sidebar -->
    <div class="clay-sidebar">
      <div class="clay-brand">
        <div class="brand-icon">S</div>
        <h1 class="brand-name">SmartCare</h1>
      </div>
      
      <ul class="nav-list">
        <li><a href="/dashboard.html" class="nav-link"><span class="nav-icon">📊</span> Dashboard</a></li>
        <li><a href="/patients.html" class="nav-link active"><span class="nav-icon">👥</span> Patients</a></li>
        <li><a href="/doctors.html" class="nav-link"><span class="nav-icon">👨‍⚕️</span> Doctors</a></li>
        <li><a href="/appointments.html" class="nav-link"><span class="nav-icon">📅</span> Appointments</a></li>
        <li><a href="/billing.html" class="nav-link"><span class="nav-icon">💳</span> Billing</a></li>
        <li><a href="/reports.html" class="nav-link"><span class="nav-icon">📈</span> Reports</a></li>
      </ul>

      <div class="sidebar-footer">
        <button onclick="logout()" class="btn-clay btn-clay-danger btn-full"><span class="nav-icon">🚪</span> Logout</button>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
      
      <!-- Top Navbar -->
      <div class="clay-navbar">
        <div class="navbar-links">
          <a href="/dashboard.html" class="navbar-item">Dashboard</a>
          <a href="/patients.html" class="navbar-item active">Patients</a>
          <a href="/doctors.html" class="navbar-item">Doctors</a>
          <a href="/appointments.html" class="navbar-item">Appointments</a>
          <a href="/billing.html" class="navbar-item">Billing</a>
          <a href="/reports.html" class="navbar-item">Reports</a>
        </div>
        <button onclick="logout()" class="btn-clay btn-clay-danger btn-sm">Logout</button>
      </div>

      <!-- Form Card -->
      <div class="clay-card">
        <h3 class="clay-card-title">➕ Add / Update Patient</h3>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="pname">Patient Name</label>
            <input type="text" id="pname" class="clay-input" placeholder="Full Name">
          </div>
          <div class="form-group" style="max-width: 130px;">
            <label class="form-label" for="page">Age</label>
            <input type="number" id="page" class="clay-input" placeholder="Age">
          </div>
          <div class="form-group">
            <label class="form-label" for="pgender">Gender</label>
            <div class="clay-select-wrapper">
              <select id="pgender" class="clay-select">
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="pcontact">Contact Number</label>
            <input type="text" id="pcontact" class="clay-input" placeholder="Phone Number">
          </div>
          <div class="form-group" style="justify-content: flex-end; min-width: 140px;">
            <button class="btn-clay btn-clay-primary" onclick="handlePatient()" style="height: 50px;">💾 Save Patient</button>
          </div>
        </div>
      </div>

      <!-- Table Card -->
      <div class="clay-card">
        <h3 class="clay-card-title">📋 Patient Directory</h3>
        <div class="clay-table-container">
          <div class="table-responsive">
            <table class="clay-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Age</th>
                  <th>Gender</th>
                  <th>Contact</th>
                  <th style="text-align: center;">Actions</th>
                </tr>
              </thead>
              <tbody id="patientTable"></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

<script>
document.addEventListener("DOMContentLoaded", function(){

let editingPatientId=null;
const token=localStorage.getItem("token");
const API="https://smartcare-hms-backend.onrender.com/api";

if(!token){
  window.location.href="/";
  return;
}

async function loadPatients(){
  try {
    const res=await fetch(`${API}/patients`,{
      headers:{ Authorization:"Bearer "+token }
    });

    const data=await res.json();
    const table=document.getElementById("patientTable");
    table.innerHTML="";

    if(!Array.isArray(data) || data.length === 0){
      table.innerHTML="<tr><td colspan='5' style='text-align:center; color: var(--text-secondary); padding: 30px;'>No patients registered yet</td></tr>";
      return;
    }

    data.forEach(p=>{
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td style="font-weight: 700; color: var(--text-primary);">${p.name || "N/A"}</td>
        <td>${p.age || "N/A"}</td>
        <td><span class="badge-clay badge-primary">${p.gender || "N/A"}</span></td>
        <td>${p.contact || "N/A"}</td>
        <td style="text-align: center; white-space: nowrap;">
          <button class="btn-clay btn-clay-secondary btn-sm" onclick="editPatient('${p._id}','${p.name}','${p.age}','${p.gender}','${p.contact}')">✏️ Edit</button>
          <button class="btn-clay btn-clay-danger btn-sm" onclick="deletePatient('${p._id}')">🗑️ Delete</button>
        </td>
      `;
      table.appendChild(tr);
    });
  } catch(e) {
    console.error(e);
  }
}

window.editPatient=function(id,name,age,gender,contact){
  editingPatientId=id;
  document.getElementById("pname").value=name;
  document.getElementById("page").value=age;
  document.getElementById("pgender").value=gender;
  document.getElementById("pcontact").value=contact;
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.handlePatient=async function(){
  const pname = document.getElementById("pname");
  const page = document.getElementById("page");
  const pgender = document.getElementById("pgender");
  const pcontact = document.getElementById("pcontact");

  const body={
    name:pname.value,
    age:page.value,
    gender:pgender.value,
    contact:pcontact.value
  };

  if(editingPatientId){
    await fetch(`${API}/patients/${editingPatientId}`,{
      method:"PUT",
      headers:{
        "Content-Type":"application/json",
        Authorization:"Bearer "+token
      },
      body:JSON.stringify(body)
    });
    editingPatientId=null;
  } else {
    await fetch(`${API}/patients`,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        Authorization:"Bearer "+token
      },
      body:JSON.stringify(body)
    });
  }

  pname.value="";
  page.value="";
  pgender.value="";
  pcontact.value="";

  loadPatients();
};

window.deletePatient=async function(id){
  if(!confirm("Are you sure you want to delete this patient?")) return;

  await fetch(`${API}/patients/${id}`,{
    method:"DELETE",
    headers:{ Authorization:"Bearer "+token }
  });
  loadPatients();
};

window.logout=function(){
  localStorage.clear();
  window.location.href="/";
};

loadPatients();

});
</script>

</body>
</html>
