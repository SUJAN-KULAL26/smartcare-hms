<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SmartCare HMS - Reports</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/claymorphism.css">
</head>

<body>

  <!-- Ambient Animated Background Blobs -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>
  <div class="bg-blob blob-4"></div>

  <div class="app-layout">
    
    <!-- Clay Sidebar -->
    <div class="clay-sidebar">
      <div class="clay-brand">
        <div class="brand-icon">S</div>
        <h1 class="brand-name">SmartCare</h1>
      </div>
      
      <ul class="nav-list">
        <li><a href="/dashboard.html" class="nav-link"><span class="nav-icon">📊</span> Dashboard</a></li>
        <li><a href="/patients.html" class="nav-link"><span class="nav-icon">👥</span> Patients</a></li>
        <li><a href="/doctors.html" class="nav-link"><span class="nav-icon">👨‍⚕️</span> Doctors</a></li>
        <li><a href="/appointments.html" class="nav-link"><span class="nav-icon">📅</span> Appointments</a></li>
        <li><a href="/billing.html" class="nav-link"><span class="nav-icon">💳</span> Billing</a></li>
        <li><a href="/reports.html" class="nav-link active"><span class="nav-icon">📈</span> Reports</a></li>
      </ul>

      <div class="sidebar-footer">
        <button onclick="logout()" class="btn-clay btn-clay-danger btn-full"><span class="nav-icon">🚪</span> Logout</button>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
      
      <!-- Top Navbar -->
      <div class="clay-navbar">
        <div class="navbar-links">
          <a href="/dashboard.html" class="navbar-item">Dashboard</a>
          <a href="/patients.html" class="navbar-item">Patients</a>
          <a href="/doctors.html" class="navbar-item">Doctors</a>
          <a href="/appointments.html" class="navbar-item">Appointments</a>
          <a href="/billing.html" class="navbar-item">Billing</a>
          <a href="/reports.html" class="navbar-item active">Reports</a>
        </div>
        <button onclick="logout()" class="btn-clay btn-clay-danger btn-sm">Logout</button>
      </div>

      <!-- Report Card -->
      <div class="clay-card">
        <h3 class="clay-card-title">📈 Doctor Wise Revenue Report</h3>
        <p style="color: var(--text-secondary); margin-bottom: 24px;">Financial breakdown of total revenue generated by each doctor.</p>

        <div class="clay-table-container">
          <div class="table-responsive">
            <table class="clay-table">
              <thead>
                <tr>
                  <th>Doctor Name</th>
                  <th style="text-align: right;">Total Revenue</th>
                </tr>
              </thead>
              <tbody id="doctorRevenueTable"></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

<script>
document.addEventListener("DOMContentLoaded", function(){

const token=localStorage.getItem("token");
const API="https://smartcare-hms-backend.onrender.com/api";

if(!token){
  window.location.href="/";
  return;
}

async function loadDoctorRevenue(){
  try {
    const res = await fetch(`${API}/billing/report/doctor-wise`,{
      headers:{ Authorization:"Bearer "+token }
    });

    const data=await res.json();
    const table=document.getElementById("doctorRevenueTable");
    table.innerHTML="";

    if(!Array.isArray(data) || data.length===0){
      table.innerHTML="<tr><td colspan='2' style='text-align:center; color: var(--text-secondary); padding: 30px;'>No revenue data available</td></tr>";
      return;
    }

    data.forEach(d=>{
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td style="font-weight: 700; color: var(--text-primary);">Dr. ${d.doctorName || "Unknown"}</td>
        <td style="text-align: right; font-weight: 800; color: var(--accent-primary); font-size: 16px;">
          ₹${d.total}
        </td>
      `;
      table.appendChild(tr);
    });
  } catch(e) { console.error(e); }
}

window.logout=function(){
  localStorage.clear();
  window.location.href="/";
};

loadDoctorRevenue();

});
</script>

</body>
</html>
