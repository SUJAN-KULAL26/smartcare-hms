<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SmartCare HMS - Authentication</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/claymorphism.css">
  <style>
    .auth-bg-decor {
      position: absolute;
      top: -20px;
      right: -20px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: var(--gradient-secondary);
      opacity: 0.15;
      filter: blur(10px);
    }
  </style>
</head>

<body>

  <!-- Ambient Animated Background Blobs -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>
  <div class="bg-blob blob-4"></div>

  <div class="auth-wrapper">
    <div class="auth-box">
      <div class="auth-bg-decor"></div>
      
      <div class="auth-header">
        <div style="display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 12px;">
          <div class="brand-icon">S</div>
          <h1 class="auth-title" style="margin:0;">SmartCare HMS</h1>
        </div>
        <p class="auth-subtitle" id="formTitle">Login</p>
      </div>

      <div style="display: flex; flex-direction: column; gap: 16px;">
        <div>
          <input type="text" id="username" class="clay-input" placeholder="Username">
        </div>

        <div>
          <input type="password" id="password" class="clay-input" placeholder="Password">
        </div>

        <div id="confirmDiv" style="display:none; flex-direction: column; gap: 6px;">
          <input type="password" id="confirmPassword" class="clay-input" placeholder="Confirm Password">
          <div id="strength" style="font-family: var(--font-body); font-weight: 600; font-size: 13px; padding-left: 6px;"></div>
        </div>

        <div id="roleSelectWrapper" style="display:none;" class="clay-select-wrapper">
          <select id="roleSelect" class="clay-select">
            <option value="Admin">Admin</option>
            <option value="Doctor">Doctor</option>
            <option value="Staff">Staff</option>
          </select>
        </div>

        <button id="actionBtn" class="btn-clay btn-clay-primary btn-full" style="margin-top: 10px;">Login</button>
      </div>

      <div class="toggle" style="margin-top: 24px; text-align: center; font-size: 15px; color: var(--text-secondary);">
        <span id="questionText">Don't have an account? </span>
        <span class="link" id="toggleLink" style="color: var(--accent-primary); font-weight: 700; cursor: pointer; text-decoration: underline;">Signup</span>
      </div>

      <div id="message" style="margin-top: 18px; text-align: center; font-size: 14px; font-weight: 600; min-height: 20px;"></div>
    </div>
  </div>

<script>

// 🔒 If already logged in → go to dashboard
if (localStorage.getItem("token")) {
  window.location.replace("/dashboard.html");
}

let isLogin = true;

const toggleLink = document.getElementById("toggleLink");
const actionBtn = document.getElementById("actionBtn");
const roleSelect = document.getElementById("roleSelect");
const roleSelectWrapper = document.getElementById("roleSelectWrapper");
const confirmDiv = document.getElementById("confirmDiv");
const message = document.getElementById("message");
const strengthText = document.getElementById("strength");

// Toggle Login / Signup
toggleLink.onclick = function() {
  isLogin = !isLogin;

  document.getElementById("formTitle").innerText = isLogin ? "Login" : "Signup";
  actionBtn.innerText = isLogin ? "Login" : "Signup";
  if (roleSelectWrapper) roleSelectWrapper.style.display = isLogin ? "none" : "block";
  confirmDiv.style.display = isLogin ? "none" : "flex";

  document.getElementById("questionText").innerText =
    isLogin ? "Don't have an account? " : "Already have an account? ";

  toggleLink.innerText = isLogin ? "Signup" : "Login";

  message.innerText = "";
};

// Password strength
document.getElementById("password").addEventListener("input", function() {
  if (isLogin) return;

  const password = this.value;

  if (password.length < 6) {
    strengthText.innerText = "Weak password";
    strengthText.style.color = "#EF4444";
  } else if (password.match(/[A-Z]/) && password.match(/[0-9]/)) {
    strengthText.innerText = "Strong password";
    strengthText.style.color = "#10B981";
  } else {
    strengthText.innerText = "Medium strength";
    strengthText.style.color = "#F59E0B";
  }
});

actionBtn.onclick = async function() {

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const confirmPassword = document.getElementById("confirmPassword")?.value;
  const role = roleSelect.value;

  if (!username || !password) {
    message.innerText = "All fields are required";
    message.style.color = "#EF4444";
    return;
  }

  if (!isLogin) {
    if (password.length <= 6) {
      message.innerText = "Password must be more than 6 characters";
      message.style.color = "#EF4444";
      return;
    }

    if (password !== confirmPassword) {
      message.innerText = "Passwords do not match";
      message.style.color = "#EF4444";
      return;
    }
  }

  const BASE_URL = "https://smartcare-hms-backend.onrender.com/api";

  const url = isLogin
    ? `${BASE_URL}/auth/login`
    : `${BASE_URL}/auth/signup`;

  const body = isLogin
    ? { username, password }
    : { username, password, role };

  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });

    const data = await res.json();

    if (res.ok) {
      if (isLogin) {
        localStorage.setItem("token", data.token);
        localStorage.setItem("role", data.role);
        window.location.replace("/dashboard.html");
      } else {
        message.style.color = "#10B981";
        message.innerText = "Signup Successful! Please Login.";
        toggleLink.click();
      }
    } else {
      message.style.color = "#EF4444";
      message.innerText = data.error || "Authentication failed";
    }

  } catch (err) {
    message.style.color = "#EF4444";
    message.innerText = "Server not reachable";
  }
};

</script>

</body>
</html>
