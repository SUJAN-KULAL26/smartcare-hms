<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SmartCare HMS - Doctors</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/claymorphism.css">
</head>

<body>

  <!-- Ambient Animated Background Blobs -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>
  <div class="bg-blob blob-4"></div>

  <div class="app-layout">
    
    <!-- Clay Sidebar -->
    <div class="clay-sidebar">
      <div class="clay-brand">
        <div class="brand-icon">S</div>
        <h1 class="brand-name">SmartCare</h1>
      </div>
      
      <ul class="nav-list">
        <li><a href="/dashboard.html" class="nav-link"><span class="nav-icon">📊</span> Dashboard</a></li>
        <li><a href="/patients.html" class="nav-link"><span class="nav-icon">👥</span> Patients</a></li>
        <li><a href="/doctors.html" class="nav-link active"><span class="nav-icon">👨‍⚕️</span> Doctors</a></li>
        <li><a href="/appointments.html" class="nav-link"><span class="nav-icon">📅</span> Appointments</a></li>
        <li><a href="/billing.html" class="nav-link"><span class="nav-icon">💳</span> Billing</a></li>
        <li><a href="/reports.html" class="nav-link"><span class="nav-icon">📈</span> Reports</a></li>
      </ul>

      <div class="sidebar-footer">
        <button onclick="logout()" class="btn-clay btn-clay-danger btn-full"><span class="nav-icon">🚪</span> Logout</button>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
      
      <!-- Top Navbar -->
      <div class="clay-navbar">
        <div class="navbar-links">
          <a href="/dashboard.html" class="navbar-item">Dashboard</a>
          <a href="/patients.html" class="navbar-item">Patients</a>
          <a href="/doctors.html" class="navbar-item active">Doctors</a>
          <a href="/appointments.html" class="navbar-item">Appointments</a>
          <a href="/billing.html" class="navbar-item">Billing</a>
          <a href="/reports.html" class="navbar-item">Reports</a>
        </div>
        <button onclick="logout()" class="btn-clay btn-clay-danger btn-sm">Logout</button>
      </div>

      <!-- Form Card -->
      <div class="clay-card">
        <h3 class="clay-card-title">👨‍⚕️ Add / Update Doctor</h3>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="dname">Doctor Name</label>
            <input type="text" id="dname" class="clay-input" placeholder="Dr. Full Name">
          </div>
          <div class="form-group">
            <label class="form-label" for="dspecialization">Specialization</label>
            <input type="text" id="dspecialization" class="clay-input" placeholder="e.g. Cardiology">
          </div>
          <div class="form-group" style="max-width: 170px;">
            <label class="form-label" for="dexperience">Experience (Yrs)</label>
            <input type="number" id="dexperience" class="clay-input" placeholder="Years">
          </div>
          <div class="form-group">
            <label class="form-label" for="dcontact">Contact</label>
            <input type="text" id="dcontact" class="clay-input" placeholder="Phone / Email">
          </div>
          <div class="form-group" style="justify-content: flex-end; min-width: 140px;">
            <button class="btn-clay btn-clay-primary" onclick="handleDoctor()" style="height: 50px;">💾 Save Doctor</button>
          </div>
        </div>
      </div>

      <!-- Table Card -->
      <div class="clay-card">
        <h3 class="clay-card-title">🩺 Doctor Registry</h3>
        <div class="clay-table-container">
          <div class="table-responsive">
            <table class="clay-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Specialization</th>
                  <th>Experience</th>
                  <th>Contact</th>
                  <th style="text-align: center;">Actions</th>
                </tr>
              </thead>
              <tbody id="doctorTable"></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

<script>
document.addEventListener("DOMContentLoaded", function(){

let editingDoctorId=null;
const token=localStorage.getItem("token");
const API="https://smartcare-hms-backend.onrender.com/api";

if(!token){
  window.location.href="/";
  return;
}

async function loadDoctors(){
  try {
    const res=await fetch(`${API}/doctors`,{
      headers:{ Authorization:"Bearer "+token }
    });

    const data=await res.json();
    const table=document.getElementById("doctorTable");
    table.innerHTML="";

    if(!Array.isArray(data) || data.length === 0){
      table.innerHTML="<tr><td colspan='5' style='text-align:center; color: var(--text-secondary); padding: 30px;'>No doctors registered yet</td></tr>";
      return;
    }

    data.forEach(d=>{
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td style="font-weight: 700; color: var(--text-primary);">${d.name || "N/A"}</td>
        <td><span class="badge-clay badge-primary">${d.specialization || "General"}</span></td>
        <td>${d.experience || 0} Years</td>
        <td>${d.contact || "N/A"}</td>
        <td style="text-align: center; white-space: nowrap;">
          <button class="btn-clay btn-clay-secondary btn-sm" onclick="editDoctor('${d._id}','${d.name}','${d.specialization}','${d.experience}','${d.contact}')">✏️ Edit</button>
          <button class="btn-clay btn-clay-danger btn-sm" onclick="deleteDoctor('${d._id}')">🗑️ Delete</button>
        </td>
      `;
      table.appendChild(tr);
    });
  } catch(e) { console.error(e); }
}

window.editDoctor=function(id,name,specialization,experience,contact){
  editingDoctorId=id;
  document.getElementById("dname").value=name;
  document.getElementById("dspecialization").value=specialization;
  document.getElementById("dexperience").value=experience;
  document.getElementById("dcontact").value=contact;
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.handleDoctor=async function(){
  const dname = document.getElementById("dname");
  const dspecialization = document.getElementById("dspecialization");
  const dexperience = document.getElementById("dexperience");
  const dcontact = document.getElementById("dcontact");

  const body={
    name:dname.value,
    specialization:dspecialization.value,
    experience:Number(dexperience.value),
    contact:dcontact.value
  };

  if(editingDoctorId){
    await fetch(`${API}/doctors/${editingDoctorId}`,{
      method:"PUT",
      headers:{
        "Content-Type":"application/json",
        Authorization:"Bearer "+token
      },
      body:JSON.stringify(body)
    });
  } else {
    await fetch(`${API}/doctors`,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        Authorization:"Bearer "+token
      },
      body:JSON.stringify(body)
    });
  }

  editingDoctorId=null;
  dname.value="";
  dspecialization.value="";
  dexperience.value="";
  dcontact.value="";

  loadDoctors();
};

window.deleteDoctor=async function(id){
  if(!confirm("Are you sure you want to delete this doctor?")) return;

  await fetch(`${API}/doctors/${id}`,{
    method:"DELETE",
    headers:{ Authorization:"Bearer "+token }
  });
  loadDoctors();
};

window.logout=function(){
  localStorage.clear();
  window.location.href="/";
};

loadDoctors();

});
</script>

</body>
</html>
