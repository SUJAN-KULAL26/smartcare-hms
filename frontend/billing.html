<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SmartCare HMS - Billing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/claymorphism.css">
</head>

<body>

  <!-- Ambient Animated Background Blobs -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>
  <div class="bg-blob blob-4"></div>

  <div class="app-layout">
    
    <!-- Clay Sidebar -->
    <div class="clay-sidebar">
      <div class="clay-brand">
        <div class="brand-icon">S</div>
        <h1 class="brand-name">SmartCare</h1>
      </div>
      
      <ul class="nav-list">
        <li><a href="/dashboard.html" class="nav-link"><span class="nav-icon">📊</span> Dashboard</a></li>
        <li><a href="/patients.html" class="nav-link"><span class="nav-icon">👥</span> Patients</a></li>
        <li><a href="/doctors.html" class="nav-link"><span class="nav-icon">👨‍⚕️</span> Doctors</a></li>
        <li><a href="/appointments.html" class="nav-link"><span class="nav-icon">📅</span> Appointments</a></li>
        <li><a href="/billing.html" class="nav-link active"><span class="nav-icon">💳</span> Billing</a></li>
        <li><a href="/reports.html" class="nav-link"><span class="nav-icon">📈</span> Reports</a></li>
      </ul>

      <div class="sidebar-footer">
        <button onclick="logout()" class="btn-clay btn-clay-danger btn-full"><span class="nav-icon">🚪</span> Logout</button>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
      
      <!-- Top Navbar -->
      <div class="clay-navbar">
        <div class="navbar-links">
          <a href="/dashboard.html" class="navbar-item">Dashboard</a>
          <a href="/patients.html" class="navbar-item">Patients</a>
          <a href="/doctors.html" class="navbar-item">Doctors</a>
          <a href="/appointments.html" class="navbar-item">Appointments</a>
          <a href="/billing.html" class="navbar-item active">Billing</a>
          <a href="/reports.html" class="navbar-item">Reports</a>
        </div>
        <button onclick="logout()" class="btn-clay btn-clay-danger btn-sm">Logout</button>
      </div>

      <!-- Form Card -->
      <div class="clay-card">
        <h3 class="clay-card-title">💳 Create Bill</h3>
        <div class="form-row">
          <div class="form-group" style="min-width: 220px;">
            <label class="form-label" for="billAppointment">Select Appointment</label>
            <div class="clay-select-wrapper">
              <select id="billAppointment" class="clay-select"></select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="consultationFee">Consultation Fee (₹)</label>
            <input type="number" id="consultationFee" class="clay-input" placeholder="Amount">
          </div>
          <div class="form-group">
            <label class="form-label" for="extraCharges">Extra Charges (₹)</label>
            <input type="number" id="extraCharges" class="clay-input" placeholder="Optional">
          </div>
          <div class="form-group">
            <label class="form-label" for="paymentMethod">Payment Method</label>
            <div class="clay-select-wrapper">
              <select id="paymentMethod" class="clay-select">
                <option value="">Payment Method</option>
                <option value="Cash">Cash</option>
                <option value="UPI">UPI</option>
                <option value="Card">Card</option>
              </select>
            </div>
          </div>
          <div class="form-group" style="justify-content: flex-end; min-width: 140px;">
            <button class="btn-clay btn-clay-primary" onclick="createBill()" style="height: 50px;">⚡ Generate Bill</button>
          </div>
        </div>
      </div>

      <!-- Table Card -->
      <div class="clay-card">
        <h3 class="clay-card-title">📜 Billing History</h3>
        <div class="clay-table-container">
          <div class="table-responsive">
            <table class="clay-table">
              <thead>
                <tr>
                  <th>Patient</th>
                  <th>Doctor</th>
                  <th>Total</th>
                  <th>Payment Method</th>
                  <th>Status</th>
                  <th>Date</th>
                  <th style="text-align: center;">Action</th>
                </tr>
              </thead>
              <tbody id="billTable"></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

<script>
document.addEventListener("DOMContentLoaded", function(){

const token=localStorage.getItem("token");
const API="https://smartcare-hms-backend.onrender.com/api";

if(!token){
  window.location.href="/";
  return;
}

async function loadBillingAppointments(){
  try {
    const res=await fetch(`${API}/appointments`,{
      headers:{ Authorization:"Bearer "+token }
    });
    const data=await res.json();
    const billAppointment = document.getElementById("billAppointment");
    billAppointment.innerHTML="<option value=''>Select Appointment</option>";
    if (Array.isArray(data)) {
      data.forEach(a=>{
        billAppointment.innerHTML+=`
          <option value="${a._id}">
            ${a.patient?.name || 'Unknown Patient'} - Dr. ${a.doctor?.name || 'Unknown Doctor'}
          </option>`;
      });
    }
  } catch(e) { console.error(e); }
}

async function loadBills(){
  try {
    const res=await fetch(`${API}/billing`,{
      headers:{ Authorization:"Bearer "+token }
    });
    const data=await res.json();
    const table=document.getElementById("billTable");
    table.innerHTML="";

    if(!Array.isArray(data) || data.length === 0){
      table.innerHTML="<tr><td colspan='7' style='text-align:center; color: var(--text-secondary); padding: 30px;'>No bills generated yet</td></tr>";
      return;
    }

    data.forEach(b=>{
      const isPaid = b.paymentStatus === "Paid";
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td style="font-weight: 700; color: var(--text-primary);">${b.patient?.name || "Unknown"}</td>
        <td>Dr. ${b.doctor?.name || "Unknown"}</td>
        <td style="font-weight: 800; color: var(--accent-primary);">₹${b.totalAmount}</td>
        <td><span class="badge-clay badge-primary">${b.paymentMethod || "N/A"}</span></td>
        <td>
          <span class="badge-clay ${isPaid ? 'badge-paid' : 'badge-unpaid'}">
            ${b.paymentStatus || 'Pending'}
          </span>
        </td>
        <td>${new Date(b.createdAt).toLocaleDateString()}</td>
        <td style="text-align: center;">
          <button class="btn-clay btn-clay-danger btn-sm" onclick="deleteBill('${b._id}')">🗑️ Delete</button>
        </td>
      `;
      table.appendChild(tr);
    });
  } catch(e) { console.error(e); }
}

window.createBill = async function () {
  const billAppointment = document.getElementById("billAppointment");
  const consultationFee = document.getElementById("consultationFee");
  const extraCharges = document.getElementById("extraCharges");
  const paymentMethod = document.getElementById("paymentMethod");

  if (!billAppointment.value) {
    alert("Please select appointment");
    return;
  }

  if (!consultationFee.value) {
    alert("Enter consultation fee");
    return;
  }

  if (!paymentMethod.value) {
    alert("Select payment method");
    return;
  }

  const res = await fetch(`${API}/billing`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token
    },
    body: JSON.stringify({
      appointmentId: billAppointment.value,
      consultationFee: Number(consultationFee.value),
      extraCharges: Number(extraCharges.value || 0),
      paymentMethod: paymentMethod.value
    })
  });

  const data = await res.json();

  if (!res.ok) {
    alert(data.error || "Failed to generate bill");
    return;
  }

  alert("Bill Generated Successfully!");
  billAppointment.value="";
  consultationFee.value="";
  extraCharges.value="";
  paymentMethod.value="";
  loadBills();
};

window.deleteBill = async function(id){
  if(!confirm("Delete this bill?")) return;

  const res = await fetch(`${API}/billing/${id}`,{
    method:"DELETE",
    headers:{ Authorization:"Bearer "+token }
  });

  const data = await res.json();

  if(!res.ok){
    alert(data.error || "Failed to delete bill");
    return;
  }

  alert("Bill deleted successfully");
  loadBills();
};

window.logout=function(){
  localStorage.clear();
  window.location.href="/";
};

loadBillingAppointments();
loadBills();

});
</script>

</body>
</html>
