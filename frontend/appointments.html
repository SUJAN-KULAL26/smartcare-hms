<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SmartCare HMS - Appointments</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/claymorphism.css">
</head>

<body>

  <!-- Ambient Animated Background Blobs -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>
  <div class="bg-blob blob-4"></div>

  <div class="app-layout">
    
    <!-- Clay Sidebar -->
    <div class="clay-sidebar">
      <div class="clay-brand">
        <div class="brand-icon">S</div>
        <h1 class="brand-name">SmartCare</h1>
      </div>
      
      <ul class="nav-list">
        <li><a href="/dashboard.html" class="nav-link"><span class="nav-icon">📊</span> Dashboard</a></li>
        <li><a href="/patients.html" class="nav-link"><span class="nav-icon">👥</span> Patients</a></li>
        <li><a href="/doctors.html" class="nav-link"><span class="nav-icon">👨‍⚕️</span> Doctors</a></li>
        <li><a href="/appointments.html" class="nav-link active"><span class="nav-icon">📅</span> Appointments</a></li>
        <li><a href="/billing.html" class="nav-link"><span class="nav-icon">💳</span> Billing</a></li>
        <li><a href="/reports.html" class="nav-link"><span class="nav-icon">📈</span> Reports</a></li>
      </ul>

      <div class="sidebar-footer">
        <button onclick="logout()" class="btn-clay btn-clay-danger btn-full"><span class="nav-icon">🚪</span> Logout</button>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
      
      <!-- Top Navbar -->
      <div class="clay-navbar">
        <div class="navbar-links">
          <a href="/dashboard.html" class="navbar-item">Dashboard</a>
          <a href="/patients.html" class="navbar-item">Patients</a>
          <a href="/doctors.html" class="navbar-item">Doctors</a>
          <a href="/appointments.html" class="navbar-item active">Appointments</a>
          <a href="/billing.html" class="navbar-item">Billing</a>
          <a href="/reports.html" class="navbar-item">Reports</a>
        </div>
        <button onclick="logout()" class="btn-clay btn-clay-danger btn-sm">Logout</button>
      </div>

      <!-- Form Card -->
      <div class="clay-card">
        <h3 class="clay-card-title">📅 Create / Update Appointment</h3>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="apatient">Select Patient</label>
            <div class="clay-select-wrapper">
              <select id="apatient" class="clay-select"></select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="adoctor">Select Doctor</label>
            <div class="clay-select-wrapper">
              <select id="adoctor" class="clay-select"></select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="adate">Appointment Date</label>
            <input type="date" id="adate" class="clay-input">
          </div>
          <div class="form-group" style="justify-content: flex-end; min-width: 140px;">
            <button class="btn-clay btn-clay-primary" onclick="handleAppointment()" style="height: 50px;">💾 Save Appointment</button>
          </div>
        </div>
      </div>

      <!-- Table Card -->
      <div class="clay-card">
        <h3 class="clay-card-title">🗓️ Scheduled Appointments</h3>
        <div class="clay-table-container">
          <div class="table-responsive">
            <table class="clay-table">
              <thead>
                <tr>
                  <th>Patient</th>
                  <th>Doctor</th>
                  <th>Date</th>
                  <th style="text-align: center;">Actions</th>
                </tr>
              </thead>
              <tbody id="appointmentTable"></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

<script>
document.addEventListener("DOMContentLoaded", function(){

let editingAppointmentId=null;
const token=localStorage.getItem("token");
const API="https://smartcare-hms-backend.onrender.com/api";

if(!token){
  window.location.href="/";
  return;
}

async function loadPatients(){
  try {
    const res=await fetch(`${API}/patients`,{
      headers:{ Authorization:"Bearer "+token }
    });
    const data=await res.json();
    const apatient = document.getElementById("apatient");
    apatient.innerHTML="<option value=''>Select Patient</option>";
    if (Array.isArray(data)) {
      data.forEach(p=>{
        apatient.innerHTML+=`<option value="${p._id}">${p.name}</option>`;
      });
    }
  } catch(e) { console.error(e); }
}

async function loadDoctors(){
  try {
    const res=await fetch(`${API}/doctors`,{
      headers:{ Authorization:"Bearer "+token }
    });
    const data=await res.json();
    const adoctor = document.getElementById("adoctor");
    adoctor.innerHTML="<option value=''>Select Doctor</option>";
    if (Array.isArray(data)) {
      data.forEach(d=>{
        adoctor.innerHTML+=`<option value="${d._id}">${d.name}</option>`;
      });
    }
  } catch(e) { console.error(e); }
}

async function loadAppointments(){
  try {
    const res=await fetch(`${API}/appointments`,{
      headers:{ Authorization:"Bearer "+token }
    });
    const data=await res.json();
    const table=document.getElementById("appointmentTable");
    table.innerHTML="";

    if(!Array.isArray(data) || data.length === 0){
      table.innerHTML="<tr><td colspan='4' style='text-align:center; color: var(--text-secondary); padding: 30px;'>No appointments scheduled yet</td></tr>";
      return;
    }

    data.forEach(a=>{
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td style="font-weight: 700; color: var(--text-primary);">${a.patient?.name || "N/A"}</td>
        <td><span class="badge-clay badge-primary">Dr. ${a.doctor?.name || "N/A"}</span></td>
        <td>📅 ${new Date(a.date).toLocaleDateString()}</td>
        <td style="text-align: center; white-space: nowrap;">
          <button class="btn-clay btn-clay-secondary btn-sm" onclick="editAppointment('${a._id}','${a.patient?._id}','${a.doctor?._id}','${a.date}')">✏️ Edit</button>
          <button class="btn-clay btn-clay-danger btn-sm" onclick="deleteAppointment('${a._id}')">🗑️ Delete</button>
        </td>
      `;
      table.appendChild(tr);
    });
  } catch(e) { console.error(e); }
}

window.editAppointment=function(id,patientId,doctorId,date){
  editingAppointmentId=id;
  document.getElementById("apatient").value=patientId;
  document.getElementById("adoctor").value=doctorId;
  document.getElementById("adate").value=date ? date.split("T")[0] : "";
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.handleAppointment=async function(){
  const apatient = document.getElementById("apatient");
  const adoctor = document.getElementById("adoctor");
  const adate = document.getElementById("adate");

  const body={
    patient:apatient.value,
    doctor:adoctor.value,
    date:adate.value
  };

  if(editingAppointmentId){
    await fetch(`${API}/appointments/${editingAppointmentId}`,{
      method:"PUT",
      headers:{
        "Content-Type":"application/json",
        Authorization:"Bearer "+token
      },
      body:JSON.stringify(body)
    });
    editingAppointmentId=null;
  } else {
    await fetch(`${API}/appointments`,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        Authorization:"Bearer "+token
      },
      body:JSON.stringify(body)
    });
  }

  loadAppointments();
};

window.deleteAppointment=async function(id){
  if(!confirm("Are you sure you want to delete this appointment?")) return;

  await fetch(`${API}/appointments/${id}`,{
    method:"DELETE",
    headers:{ Authorization:"Bearer "+token }
  });
  loadAppointments();
};

window.logout=function(){
  localStorage.clear();
  window.location.href="/";
};

loadPatients();
loadDoctors();
loadAppointments();

});
</script>

</body>
</html>
